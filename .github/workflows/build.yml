name: Build desktop applications

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            artifact: windows
            artifact-path: frontend/dist-electron/*.exe
          - platform: Linux
            runner: ubuntu-latest
            artifact: linux
            artifact-path: frontend/dist-electron/*.AppImage

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Package Python backend
        working-directory: backend
        run: pyinstaller --clean --noconfirm --onefile --name backend_orchestrator --paths src --distpath dist --workpath build src/backend_orchestrator.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop application
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sizemap-${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
