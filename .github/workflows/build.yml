name: Build desktop applications

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            artifact: windows
            artifact-path: frontend/dist-electron/sizemap.exe
          - platform: Linux
            runner: ubuntu-latest
            artifact: linux
            artifact-path: frontend/dist-electron/sizemap.appimage

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Package Python backend
        working-directory: backend
        run: pyinstaller --clean --noconfirm --onefile --name backend_orchestrator --paths src --distpath dist --workpath build src/backend_orchestrator.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop application
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Name Windows installer
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem frontend/dist-electron -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows .exe installer was not generated." }
          Rename-Item $installer.FullName sizemap.exe

      - name: Name Linux installer
        if: matrix.platform == 'Linux'
        run: |
          installer="$(find frontend/dist-electron -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$installer" ]; then
            echo "Linux AppImage was not generated." >&2
            exit 1
          fi
          mv "$installer" frontend/dist-electron/sizemap.appimage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sizemap-${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: sizemap-*
          path: release-assets
          merge-multiple: true

      - name: Publish release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: SizeMap ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.appimage
